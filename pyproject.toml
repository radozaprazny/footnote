[project]
name = "matchlens"
version = "0.1.0"
description = "Explainable, personalized match intelligence from synthetic football events (hackathon entry)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-anthropic==1.0.0b261015",
    "agent-framework-core==1.22.0",
    "azure-identity==1.26.0",
    "fastapi>=0.148.0",
    "mcp>=1.24,<2",
    "uvicorn>=0.54.0",
]

[project.scripts]
matchlens = "matchlens.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "hypothesis>=6.170.1",
    "playwright==1.64.0",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["serial: timing flakes under load, so scripts/ci.sh runs it alone, after the rest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
