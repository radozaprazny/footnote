name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pipx install uv
      # the web page's end-to-end test drives headless Chromium (M4)
      - run: uv sync --locked && uv run playwright install --with-deps chromium
      - run: scripts/ci.sh
